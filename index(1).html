<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Privacy Camera 試用版</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#101216;color:#f3f4f6;font-family:system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:auto;padding:18px}
h1{font-size:20px;letter-spacing:.08em;text-align:center;margin:8px 0 6px}
p{color:#b8bec8;font-size:14px;line-height:1.55}
.stage{position:relative;background:#050608;border:1px solid #303640;border-radius:16px;overflow:hidden;min-height:260px;touch-action:none}
video{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;background:#050608}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:650;background:#65d6a6;color:#07130e}
button.secondary{background:#303640;color:#f3f4f6}
button:disabled{opacity:.45}
#status{min-height:24px;text-align:center;color:#c9d2dc}
.note{font-size:12px;color:#929ba8}
</style>
</head>
<body>
<main>
<h1>PRIVACY CAMERA</h1>
<p>カメラ映像の上を指でドラッグして、モザイクをかけたい範囲を囲んでください。</p>
<div class="stage" id="stage">
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
</div>
<div class="controls">
<button id="start">カメラを起動</button>
<button class="secondary" id="clear" disabled>モザイクを解除</button>
<button class="secondary" id="stop" disabled>カメラを停止</button>
</div>
<div id="status">カメラはまだ起動していません</div>
<p class="note">試用版：手動で囲んだ範囲にピクセル風のマスクを表示します。撮影・録画・保存・アップロードはしません。顔の自動認識や人物の識別は行いません。カメラ利用にはHTTPS接続とブラウザのカメラ許可が必要です。</p>
</main>
<script>
const video=document.getElementById('video'), canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d'), statusEl=document.getElementById('status');
const startBtn=document.getElementById('start'), clearBtn=document.getElementById('clear'), stopBtn=document.getElementById('stop');
let stream=null, rect=null, dragStart=null, current=null;
function resize(){
 const r=video.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
 canvas.width=Math.max(1,Math.round(r.width*dpr)); canvas.height=Math.max(1,Math.round(r.height*dpr));
 canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
 draw();
}
function draw(){
 const dpr=window.devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
 const r=rect||current;if(!r)return;
 const left=Math.min(r.x1,r.x2),top=Math.min(r.y1,r.y2),w=Math.abs(r.x2-r.x1),h=Math.abs(r.y2-r.y1);
 if(w<3||h<3)return;
 ctx.save();ctx.beginPath();ctx.rect(left,top,w,h);ctx.clip();
 const block=14;let row=0;
 for(let y=top;y<top+h;y+=block){let col=0;for(let x=left;x<left+w;x+=block){
 ctx.fillStyle=((row+col)%2===0)?'#25282d':'#08090b';ctx.fillRect(x,y,block,block);col++;
 }row++;}
 ctx.restore();ctx.strokeStyle='#65d6a6';ctx.lineWidth=2;ctx.strokeRect(left,top,w,h);
}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
canvas.addEventListener('pointerdown',e=>{if(!stream)return;canvas.setPointerCapture(e.pointerId);dragStart=point(e);current={x1:dragStart.x,y1:dragStart.y,x2:dragStart.x,y2:dragStart.y};draw();});
canvas.addEventListener('pointermove',e=>{if(!dragStart)return;const p=point(e);current={x1:dragStart.x,y1:dragStart.y,x2:p.x,y2:p.y};draw();});
canvas.addEventListener('pointerup',e=>{if(!dragStart)return;const p=point(e);rect={x1:dragStart.x,y1:dragStart.y,x2:p.x,y2:p.y};dragStart=null;current=null;draw();statusEl.textContent='指定範囲にモザイクを表示中';clearBtn.disabled=false;});
startBtn.addEventListener('click',async()=>{
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('このブラウザではカメラ機能を利用できません。HTTPSのページをChromeで開いてください。');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  video.srcObject=stream;await video.play();resize();
  startBtn.disabled=true;clearBtn.disabled=false;stopBtn.disabled=false;
  statusEl.textContent='カメラ起動中。映像上を指で囲んでください。';
 }catch(err){statusEl.textContent=err.message||'カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。';}
});
clearBtn.addEventListener('click',()=>{rect=null;current=null;draw();statusEl.textContent=stream?'モザイクを解除しました':'カメラはまだ起動していません';});
stopBtn.addEventListener('click',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;rect=null;current=null;draw();startBtn.disabled=false;clearBtn.disabled=true;stopBtn.disabled=true;statusEl.textContent='カメラを停止しました';});
window.addEventListener('resize',resize);
</script>
</body>
</html>
